plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sunzhe.tvquiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.sunzhe.tvquiz"
        minSdk 24
        targetSdk 33
        versionCode 5
        versionName "1.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies: pure Android framework, works offline and on TV boxes.
}
